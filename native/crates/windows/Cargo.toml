[package]
name = "shiftpane-windows"
description = "Windows backend: Virtual Display Driver (IddCx) configuration and Win32 display control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
shiftpane-core.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# WinRT, for the system media controls (what is playing, play/pause/next/previous).
windows = { workspace = true, features = ["Foundation", "Media_Control"] }

[lints]
workspace = true
